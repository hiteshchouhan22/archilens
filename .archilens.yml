# ArchiLens's own architecture, checked on every pull request by
# .github/workflows/archilens.yml. For an annotated example to start from,
# run `archilens init` in your repository (or see
# archilens/templates/archilens.example.yml).

project:
  name: "ArchiLens"
  description: "Layered architecture diagrams, drift detection and an MCP server for Git repositories"
  type: "library"

capabilities:
  - name: "Core"
    description: "CLI, configuration, pipeline orchestration, data models"
    modules:
      - "archilens"            # top-level module: cli.py only
      - "archilens/config/**"
      - "archilens/engine/**"
      - "archilens/rules/**"
      - "archilens/models/**"
      - "archilens/utils/**"

  - name: "Static Analysis"
    description: "Discovery, Tree-sitter extraction, import resolution, diff, evolution"
    modules:
      - "archilens/analyzers/**"

  - name: "Diagram Generation"
    description: "Mermaid, D2 and PlantUML output"
    modules:
      - "archilens/generators/**"

  - name: "AI Enrichment"
    description: "Optional LLM summaries, process flows and pattern detection"
    modules:
      - "archilens/ai/**"

  - name: "Integrations"
    description: "Interactive viewer and MCP server"
    modules:
      - "archilens/viewer/**"
      - "archilens/mcp/**"

external_systems:
  - name: "Git repository"
    type: "external_api"
    description: "Analysed working tree and refs"
  - name: "Anthropic API"
    type: "external_api"
    description: "Optional AI enrichment"
  - name: "MCP clients"
    type: "external_api"
    description: "Coding agents such as Claude Code and Cursor"

ai:
  provider: "anthropic"
  model: "claude-opus-5-5"
  effort: "low"

ci:
  fail_on: "new"
  rules:
    # The data model is a leaf: everything may use it, it uses nothing else in ArchiLens.
    - name: "models-are-a-leaf"
      type: "forbidden-dependency"
      from: "archilens/models/**"
      to: "archilens/**"
      action: "fail"

    # Static analysis must work without an LLM.
    - name: "analysis-without-ai"
      type: "forbidden-dependency"
      from_capability: "Static Analysis"
      to_capability: "AI Enrichment"
      action: "fail"

    # Analysis produces data; turning it into Markdown or diagrams is the generators' job.
    - name: "analysis-without-rendering"
      type: "forbidden-dependency"
      from_capability: "Static Analysis"
      to_capability: "Diagram Generation"
      action: "fail"

    # Generators turn a snapshot into text; they must not reach into the viewer or MCP server.
    - name: "generators-independent-of-integrations"
      type: "forbidden-dependency"
      from_capability: "Diagram Generation"
      to_capability: "Integrations"
      action: "fail"

    - name: "acyclic-modules"
      type: "no-cycles"
      action: "fail"

    # Only the CLI sits at the top; no package may depend on it.
    - name: "nothing-depends-on-the-cli"
      type: "forbidden-dependency"
      from: "archilens/**"
      to: "archilens"
      action: "fail"

    - name: "small-surface"
      type: "max-fan-out"
      threshold: 8
      action: "warn"
