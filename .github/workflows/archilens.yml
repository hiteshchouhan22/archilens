# ArchiLens on ArchiLens: every pull request is checked against the rules in
# .archilens.yml, using the composite action from this checkout and the
# ArchiLens code under review (install: "."), without an API key.

name: Architecture

on:
  pull_request:
    branches: [master]

permissions:
  contents: read
  pull-requests: write   # post or update the architecture-diff comment

jobs:
  archilens:
    name: ArchiLens
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # the diff needs the base commit

      - uses: ./   # the root action.yml, as Marketplace users get it
        with:
          install: "."
          enable-ai: "false"
          fail-on-violations: "true"
