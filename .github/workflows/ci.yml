name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev,viewer,mcp,ai]"

      - name: Run tests
        run: pytest tests/ -v --cov=archilens --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v7
        if: matrix.python-version == '3.11'
        with:
          files: coverage.xml
          fail_ci_if_error: false

  diagrams:
    name: Diagrams render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -e .

      # Generates every level in Mermaid, D2 and PlantUML (incl. a fixture full of
      # quotes, braces, # and ; in names) and renders each with the official tool:
      # the minlag/mermaid-cli, terrastruct/d2 and plantuml/plantuml Docker images.
      - name: Render all diagram formats
        run: python scripts/render_check.py

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev,viewer,mcp,ai]"

      - name: Ruff (lint + format check)
        run: |
          ruff check archilens/
          ruff format --check archilens/

      - name: Mypy
        run: mypy archilens/
