name: Bug report
description: Something ArchiLens did wrong, or a crash
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. The details below let us reproduce it without a round of questions.
        **Please don't paste API keys, and remove anything private from logs and config.**
        A security problem? Report it privately instead: see [SECURITY.md](https://github.com/saurabh-oss/archilens/blob/master/SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you saw, and what you expected instead. A wrong diagram counts as a bug.
      placeholder: "`archilens analyze` found 0 files in my Go repository; I expected the packages under internal/."
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: Command you ran
      placeholder: archilens analyze --repo . --format d2
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output or traceback
      description: Add `-v` to the command for more detail. This is formatted as code automatically.
      render: text
  - type: input
    id: version
    attributes:
      label: ArchiLens version
      description: Output of `archilens --version`, or the action version in your workflow (e.g. v0.15.0)
      placeholder: archilens, version 0.15.0
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where it runs
      options:
        - CLI on my machine
        - GitHub Action
        - MCP server (Claude Code, Cursor, ...)
        - Interactive viewer (archilens serve)
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: OS and Python version
      placeholder: Windows 11, Python 3.12
    validations:
      required: true
  - type: input
    id: repository
    attributes:
      label: The repository you analysed
      description: A public repository and commit we can run it on is the fastest route to a fix. Otherwise its main languages and rough size.
      placeholder: https://github.com/gin-gonic/gin at v1.12.0, or "private, TypeScript monorepo, ~2,000 files"
  - type: textarea
    id: config
    attributes:
      label: Your .archilens.yml, if you have one
      render: yaml
